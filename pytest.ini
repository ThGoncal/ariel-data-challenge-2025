[pytest]
# =============================================================================
# Configuration pytest — Ariel Data Challenge 2025
# =============================================================================

# Dossier des tests
testpaths = tests

# Affichage verbeux par défaut
addopts =
    --verbose
    --tb=short
    --strict-markers
    --no-header
    -ra

# Markers personnalisés (pour filtrer les tests avec -m)
markers =
    slow: tests lents (Numba warm-up, modèles larges) — exclus par défaut en CI
    integration: tests d'intégration nécessitant les données téléchargées
    gpu: tests nécessitant un GPU CUDA

# Durée minimale pour afficher les tests lents
log_cli = true
log_cli_level = WARNING

# Couleurs dans le terminal
console_output_style = progress
