global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "model-api"
    static_configs:
      - targets: ["model-api:8001"]
    metrics_path: /metrics

  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: /admin/metrics

  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]
