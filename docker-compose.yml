# docker-compose.yml — Ariel Data Challenge 2025
#   docker compose --profile mlflow up -d          # serveur MLflow  -> http://localhost:5000
#   docker compose --profile incremental run --rm incremental
#   docker compose --profile airflow up            # Airflow standalone -> http://localhost:8080
#   docker compose --profile test run --rm test
# Les identifiants Kaggle (~/.kaggle) sont montés en lecture seule, jamais copiés dans l'image.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["./mlruns_server:/mlflow"]
    profiles: ["mlflow", "incremental", "airflow"]

  incremental:
    build: {context: ., dockerfile: docker/Dockerfile.incremental}
    image: ariel-incremental:latest
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    env_file: [{path: .env, required: false}]
    volumes:
      - ./data:/app/data
      - ${HOME}/.kaggle:/root/.kaggle:ro
      - ./.numba_cache:/app/.numba_cache
    depends_on: [mlflow]
    restart: "no"
    profiles: ["incremental"]

  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    ports: ["8080:8080"]
    environment:
      - PYTHONPATH=/opt/airflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _PIP_ADDITIONAL_REQUIREMENTS=numpy pandas pyarrow scipy numba joblib tqdm pyyaml python-dotenv kaggle scikit-learn mlflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ${HOME}/.kaggle:/home/airflow/.kaggle:ro
    depends_on: [mlflow]
    profiles: ["airflow"]

  test:
    build: {context: ., dockerfile: docker/Dockerfile.test}
    image: ariel-test:latest
    command: tests/unit -m "not slow" -q
    profiles: ["test"]
